name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: clipforge, POSTGRES_PASSWORD: clipforge, POSTGRES_DB: clipforge }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clipforge" --health-interval 3s --health-retries 20
    env:
      CLIPFORGE_ENV: test
      CLIPFORGE_TEST_DATABASE_URL: postgresql+psycopg://clipforge:clipforge@127.0.0.1:5432/clipforge_test
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg + fonts (real render tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen --python 3.12
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check
        run: uv run mypy clipforge apps
      - name: Module boundaries
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest -q --cov=clipforge --cov-report=term-missing
      - name: Migrations match models
        env:
          CLIPFORGE_DATABASE_URL: postgresql+psycopg://clipforge:clipforge@127.0.0.1:5432/clipforge_test
        run: uv run alembic check

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
