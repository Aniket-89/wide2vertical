server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    # Server-level headers only: an add_header inside a location would drop all of these.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; media-src 'self' blob:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_buffering off;          # stream clip downloads instead of spooling them
        client_max_body_size 1m;
    }

    location /assets/ {
        expires max;                  # file names are content-hashed
    }

    location / {
        expires -1;                   # index.html: always revalidate
        try_files $uri /index.html;
    }
}
